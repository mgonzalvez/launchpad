<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Your saved PnP Launchpad projects — a private watchlist kept in your own browser." />
    <meta property="og:title" content="Watchlist | PnP Launchpad" />
    <meta property="og:description" content="Your saved PnP Launchpad projects — a private watchlist kept in your own browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://launchpad.gonzhome.us/watchlist.html" />
    <meta property="og:image" content="https://launchpad.gonzhome.us/uploads/og-launchpad.jpg" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://launchpad.gonzhome.us/watchlist.html" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="shortcut icon" href="assets/logo.svg" />
    <title>Watchlist | PnP Launchpad</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pnpl_theme_v1');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="assets/app.js"></script>
    <script src="assets/search.js"></script>
    <script>
      (async () => {
        const el = document.getElementById('app');
        const data = await PNPL.loadContent();
        const projects = PNPL.enrichProjects(data);
        const watchlistSlugs = PNPL.getWatchlistSlugs();
        const projectBySlug = new Map(projects.map((p) => [String(p.slug || ''), p]));
        const watched = watchlistSlugs.map((slug) => projectBySlug.get(slug)).filter(Boolean);

        el.innerHTML = `
          ${PNPL.header('Watchlist')}
          <main id="main">
            <section class="hero">
              <h1>Your Watchlist</h1>
              <p>Saved projects are stored locally in this browser only.</p>
              ${watched.length ? '<button type="button" id="clear-watchlist-btn">Clear watchlist</button>' : ''}
            </section>
            ${watched.length ? `<div class="grid">${watched.map((p) => PNPL.projectCard(p)).join('')}</div>` : PNPL.emptyState('Your watchlist is empty', 'Use the Save button on any project card to keep it here for later.')}
          </main>
          ${PNPL.footer()}
        `;

        const clearBtn = document.getElementById('clear-watchlist-btn');
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            PNPL.clearWatchlist();
            window.location.reload();
          });
        }
      })();
    </script>
  </body>
</html>
