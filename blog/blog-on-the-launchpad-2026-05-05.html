    <title>What's New on the Launchpad, May 5, 2026 | PnP Launchpad</title>

    <script src="../assets/search.js"></script>
    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/blog-collage-2026-05-05.jpg?v=20260505a" alt="3x3 collage featuring Mïnomancer, Play With Fire, Cryptid Creek, Shinobi Spy & Supply, EFS: The Universal Voting Game, Nine Nights Siege, Bee The Buzz, Flock and Squabble, and Iron Protocol: Exodus." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: May 5, 2026</p>
              <h1>What's New on the Launchpad, May 5, 2026</h1>

              <p><strong>Five new projects went live on the Launchpad today, and the live rail has grown to eight active campaigns.</strong> The May 5 wave is a heavy one — Mïnomancer, Play With Fire, Cryptid Creek, and Shinobi Spy & Supply all launched on Kickstarter and Gamefound today, while EFS: The Universal Voting Game and Nine Nights Siege went live yesterday. Add in the projects that have been building since early May (Bee The Buzz, Flock and Squabble, Iron Protocol: Exodus) and the Launchpad is at one of its busiest points this year.</p>

              <p><strong><a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer: Roll em Bones!</a> from pagepunk is the standout new entry today.</strong> Designer Jack Chapman has built a solo roll-and-write dungeon crawler where you raise a skeletal army to explore a rival necromancer's lair. You arrange skeletons in polyomino formations to search for keys, uncover traps, battle enemies, and fight one of 15+ bosses across three configurable dungeon levels using eight skeleton classes. It's on Gamefound and has been one of the most anticipated upcoming projects for weeks. The visual identity is strong, the mechanics are clear, and the solo focus makes it an easy recommendation for anyone who plays alone.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/umbrapublishing/play-with-fire-the-card-game">Play With Fire - The Card Game</a> from Umbra Publishing is another strong launch-day pitch.</strong> Designer Pierluigi De Luca has built a strategic push-your-luck elimination game for 2-6 players where you accumulate mana by challenging the Brazier, cast powerful spells, and strike your opponents. The component count is low, the player count is high, and the push-your-luck core is a proven hook. Kickstarter, ends May 26.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/mayhemdelight/cryptid-creek-build-a-legend">Cryptid Creek: Build a Legend</a> from Mayhem &amp; Delight Games takes a more comedic angle.</strong> Designer Nicole Fende has created a competitive card game where players craft fake cryptids from mismatched body parts to save their dying town. Only one can win, but if the reality TV crew exposes the hoax, everyone loses. It's got a $3 PnP tier and a genuinely fun premise. Kickstarter, ends May 28.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/orcaislandgames/shinobi-spy-and-supply">Shinobi Spy <p><strong>Shinobi Spy & Supply from Orca Island Games Supply</a> from Orca Island Games is a small card game about two competing shops selling gear to Japanese fantasy spies.</strong> Designers Leslie Kolke and Jered Byford have kept the scope tight — it's a $3 PnP tier, compact, and sounds like a quick session game. Kickstarter, ends May 31.</p>

              <p><strong>Yesterday's launches are also worth flagging.</strong> <a href="https://www.kickstarter.com/projects/ex1stgames/efs-the-universal-voting-game">EFS: The Universal Voting Game</a> (Charles Ward / EX FIRST GAMES) is a party game where aliens vote on Earth stuff and try to figure out who the human is. Short games, light, silly — and it has late pledge available through June 4. <a href="https://www.kickstarter.com/projects/lanternling/nine-nights-siege">Nine Nights Siege</a> (Alex Ivanov) is a tactical solo/co-op PnP game that the designer has been working on for a year. Kickstarter, ends May 25.</p>

              <p><strong>On the live rail, eight campaigns are now running.</strong> <a href="https://www.kickstarter.com/projects/nukazombee/iron-protocol-exodus?ref=4ftgv4">Iron Protocol: Exodus</a> (ends May 31) remains one of the heaviest tactical pitches on the site — mech deployment, survivor extraction, hostile territory. <a href="https://www.kickstarter.com/projects/tholen/flock-and-squabble">Flock and Squabble</a> (ends May 31) is a fast family-friendly card game launching as part of MicroMay. <a href="https://www.kickstarter.com/projects/edugamingcollective/bee-the-buzz">Bee The Buzz</a> (ends May 31) is an educational dexterity card game about native Australian bees, with scientists helping verify the content. <a href="https://www.kickstarter.com/projects/gonzhome/greetings-from-earth">Greetings from Earth</a> (ends May 23) is the roll-and-write world tour game from sloppygames. <a href="https://www.kickstarter.com/projects/hp1/nothing-but-net-2-player-head-to-head-basketball-card-game">Nothing But Net</a> (ends May 20) is the two-player basketball card and dice game. <a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy's Tomb</a> (ends May 18) continues on Gamefound. <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a> (ends May 15) is the alien-infested spaceship survival challenge. And <a href="https://www.kickstarter.com/projects/pocket-puffins/pocket-puffins-lost-in-space-18-card-solo-space-puzzle">Pocket Puffins: Lost in Space</a> (ends May 14) is still the lowest-risk entry at $1.</p>

              <p><strong>One project closed since the last update.</strong> <a href="https://www.kickstarter.com/projects/283509132/the-cats-of-new-orleans">The Cats of New Orleans</a> (Marco Pecota) ended on May 7 — just two days after the last blog post. If you missed it, it's now in the archive. The rest of the live rail has plenty of runway still.</p>

              <p><strong>Bottom line:</strong> <a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer</a> is the strongest new launch today — it's been building for weeks, the pitch is clear, and the solo roll-and-write dungeon crawler niche is one the Launchpad covers well. If you're looking for something lighter, <a href="https://www.kickstarter.com/projects/mayhemdelight/cryptid-creek-build-a-legend">Cryptid Creek</a>'s fake-cryptid premise is genuinely funny, and EFS is the easiest party game pick at a quick session length. The live rail is at eight projects — Pocket Puffins and Sole Survivor are the closest to closing, so those are the ones to watch if you've been waiting.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
        </main>
        ${PNPL.footer()}
      `;
      PNPL.setMainLinksNewTab();
    </script>
