        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/blog-collage-facebook-may-21.jpg?v=20260521a" alt="3x3 collage featuring projects highlighted in the PnP Hideaway Facebook group this week." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: May 21, 2026</p>
              <h1>PnP Projects from the Facebook Group, May 21, 2026</h1>

              <p><strong>The PnP Hideaway Facebook group has been a goldmine this week, with creators posting updates on campaigns that span every stage of the crowdfunding lifecycle — from brand new launches to late-pledge windows and upcoming previews.</strong> I pulled together the projects that showed up in the group over the last few days, cross-referenced them against the Launchpad, and here's what I found.</p>

              <p>Most of these are already on the site, but it's worth highlighting them as a group because they represent the kind of steady, community-driven pipeline that keeps the PnP model alive: designers posting updates, backers cheering them on, and new names popping up every week.</p>

              <p><strong>Mïnomancer: Roll em Bones! by Robin Metz (pagepunk) — Gamefound, launched May 5.</strong> This solo roll-and-write dungeon crawler has been one of the most anticipated upcoming projects for weeks, and it finally went live. You raise a skeletal army, arrange polyomino formations, and fight 15+ bosses across three configurable dungeon levels using eight skeleton classes. Designer Robin Metz posted in the group with a countdown reminder: one more week to go. The visual identity is strong, the mechanics are clear, and the solo focus makes it an easy recommendation. <em>(Note: the project was previously listed under the wrong designer name — corrected to Robin Metz.)</em></p>

              <p><strong>Bravery by Radek Ignatów — Kickstarter, launching June 9.</strong> A card-based survival game about surviving in the wilderness. Radek posted in the group announcing the June 9 launch date, giving backers a few weeks to get ready. This one isn't live yet, but it's on the Launchpad as an upcoming project and worth keeping an eye on.</p>

              <p><strong>Flipping Fortune by Georg Fischer — Kickstarter, ends May 26.</strong> A quirky push-your-luck tarot card game with some deckbuilding. Georg posted in the group noting they're in the last week of the campaign and released a new bonus card for all backers in an update. If you've been sitting on the fence, you have about a week left. The $3 PnP tier makes it a low-risk entry.</p>

              <p><strong>Roll 4 MORE Rum! by Florian Fiedler — Gamefound, preview.</strong> The expansion to the beloved Roll4Rum series. Florian posted in the group teasing more details about the game and a look at the map coming this week. No launch date yet, but the Gamefound page is live and the preview is up. This one expands the Roll4Rum world with deeper mechanics, specialized crew, and a brand-new way to command your ship — not just a map, but a career on the high seas.</p>

              <p><strong>Dungeon Legacy: A Roll &amp; Crawl PnP Adventure by Nezih Savı — Kickstarter, ends June 10.</strong> Nezih posted in the group celebrating that the campaign is fully funded. A roll-and-crawl dungeon adventure with just a few sheets and three dice, published by Keepers of Fun. It's one of the newer entries on the live rail and has plenty of runway left.</p>

              <p><strong>Crown &amp; Courage by Petter Schanke Olsen — Kickstarter, preview.</strong> Petter posted in the group announcing that the Kickstarter launches June 2, with a free PnP already available on the preview page. The game casts you as the King of Norway, escaping the Germans and inspiring hope for your country. Premium PnP pledges during the campaign also include all of the designer's previous games, including Halls of Hegra. This one is on the Launchpad as a preview project.</p>

              <p><strong>Rope Walkers by A. R. Curry — Kickstarter, ends May 25.</strong> Curry C Curry posted in the group noting the campaign is nearly over and announcing that Faith Dickey is joining the game as an exclusive variant card for all backers. A joyful dice-rolling pocket game about balance, bravery, and keeping the world together. Solo-only, and you play as a rope walker attending a festival to celebrate the day the world was split in two by a comet but held together by a single rope. About four days left.</p>

              <p><strong>Red Panda Surprise by Dylan Coyle — Backerkit, ends May 28.</strong> Dylan posted in the group noting the PnP Kickstarter is nearly over. Fast card game where red pandas try to scare each other, but are too cute! The Backerkit campaign for the physical game runs alongside, so there's a dual-track situation here. About a week left on the PnP side.</p>

              <p><strong>Iron Protocol: Exodus by NukaZombee Games — Kickstarter, ends May 31.</strong> Denis Kurdiukov's team posted in the group celebrating being halfway through the campaign with 340+ mech pilots ready. A compact solo experience for fans of sci-fi, heavy machinery, and tactical combat. Take control of a mech unit and push through hostile territory — engaging enemy machines while extracting survivors from the ruins. Requires only a handful of components to assemble. One of the heaviest tactical pitches on the live rail, and it has ten days left.</p>

              <p><strong>Hidden Realms: The Mummy's Tomb by Spiros Kallos — Gamefound, ended May 18 (late-pledge).</strong> Spiros posted in the group announcing that the pledge manager and late-pledge are now open for anyone who missed the campaign. A single-page, print-and-play, roll-and-write dungeon crawl inspired by classic D&amp;D maps. Draw polyomino shapes to map a new dungeon every game, uncover treasure, face deadly guardians, and confront the Mummy. The campaign itself has closed, but the late-pledge window is open.</p>

              <p><strong>And one more from the group: Charles Ward / Circat.</strong> Charles posted in the group covering three of his games at the Tokyo Game Market, all available as free print-and-play. EFS: The Universal Voting Game is already on the Launchpad (ends June 4, late-pledge available). The other two Circat games mentioned in the post aren't currently on the site — worth adding if you want full coverage of Charles's output.</p>

              <p><strong>Here's the breakdown by status:</strong></p>

              <p>
                <strong>Live now:</strong>
                <a href="https://www.kickstarter.com/projects/herrgoldberg/flipping-fortune">Flipping Fortune</a> (ends May 26) ·
                <a href="https://www.kickstarter.com/projects/keepersoffun/dungeon-legacy-a-roll-and-crawl-pnp-adventure">Dungeon Legacy</a> (ends June 10) ·
                <a href="https://www.kickstarter.com/projects/arcurry/rope-walkers">Rope Walkers</a> (ends May 25) ·
                <a href="https://www.kickstarter.com/projects/dylancoyle/red-panda-surprise">Red Panda Surprise</a> (ends May 28) ·
                <a href="https://www.kickstarter.com/projects/nukazombee/iron-protocol-exodus?ref=4ftgv4">Iron Protocol: Exodus</a> (ends May 31) ·
                <a href="https://www.kickstarter.com/projects/ex1stgames/efs-the-universal-voting-game">EFS: The Universal Voting Game</a> (ends June 4) ·
                <a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer</a> (no end date)
              </p>

              <p>
                <strong>Upcoming:</strong>
                <a href="https://www.kickstarter.com/projects/radek-ignatow/bravery">Bravery</a> (launches June 9)
              </p>

              <p>
                <strong>Preview:</strong>
                <a href="https://gamefound.com/en/projects/florianfiedler/roll-4-more-rum">Roll 4 MORE Rum!</a> ·
                <a href="https://www.kickstarter.com/projects/tompet/crown-and-courage">Crown &amp; Courage</a> (launches June 2)
              </p>

              <p>
                <strong>Late pledge:</strong>
                <a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy's Tomb</a>
              </p>

              <p><strong>Bottom line:</strong> The PnP Hideaway Facebook group continues to be the best single source for discovering new PnP crowdfunding projects. Every week, the same core group of creators keeps posting, and every week, there are more new names on the list. The Launchpad has 10 of the 11 projects mentioned in the group this week — the only gap is the two unnamed Circat games from Charles Ward's Tokyo Game Market post. If you're not already following the group, it's worth a look.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
