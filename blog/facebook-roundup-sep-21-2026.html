    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/pnp-collage-3x3-sep-21.png?v=20260921a" alt="3x3 collage featuring Solo Haunting, Around the World in 80 Dice, Dead Trail, Midway 1022, Steel Whisper, Iron Quest, Forgotten Paths, Of Wheat &amp; Wonders, and Roll 4 More Rum." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: September 21, 2026</p>
              <h1>PnP Projects from the Facebook Group, September 21, 2026</h1>

              <p><strong>The PnP Hideaway self-promotion thread was busy today, with nine projects covering the full crowdfunding spectrum.</strong> One campaign is in its final hours, one launches tomorrow, two new previews joined the site, and a late-pledge window just opened. I cross-referenced everything against the Launchpad, and for once there are no gaps — every project in the thread is already tracked. Here's the breakdown, organized by status.</p>

              <h2>Live Now</h2>

              <p><strong><a href="https://gamefound.com/en/projects/beaverlicious-games/of-wheat-wonders-the-little-solitaire-civilization-game-dynamic-pnp-of-the-month-gamebook">Of Wheat &amp; Wonders</a> by Robin Metz (pagepunk) — Gamefound, final day.</strong> Robin posted: "24 hours left! ... what a journey this has been so far." It's a dynamic solo civilization game — generate a map, gather resources, expand settlements, and unlock advancements across a 15-year reign shaped by unexpected disasters — powered by an online configurator that lets you design your own scenarios. If you want in, today is the day. The campaign ends September 21.</p>

              <p><strong><a href="https://gamefound.com/en/projects/tabletop-for-world/forgotten-paths">Forgotten Paths</a> by Spiros Kallos (Tabletop for World) — Gamefound, 17 days left.</strong> Spiros announced the campaign is "complete!" with all stretch goals unlocked. You enter the mist as a Mistwalker in a solo Storybook-driven campaign of exploration, dangerous encounters, and meaningful choices — complete quests, purchase items, unlock talents, and see where the Misty Isle takes you. Runs through October 8.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/105281170/midway-1022-a-solitaire-carrier-battle-game?ref=activity">Midway 1022</a> by Martin Melbardis (Solo Wargame) — Kickstarter, 3 days left.</strong> Martin called it: "It's the last 72 hours left on Kickstarter." It's a solo wargame about the Battle of Midway, where you command the Yorktown, Enterprise, and Hornet against the Japanese Kido Butai through dice drafting and carefully timed air strikes. The campaign ends September 24, with a late pledge available after that.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/marcosalogni/dead-trail?ref=3gbddr">Dead Trail</a> by Marco Salogni — Kickstarter, live.</strong> Marco posted that the campaign is underway, and it's a zombie "maze-and-write" game where every step could be your last. Running September 15 through October 6.</p>

              <h2>Upcoming</h2>

              <p><strong><a href="https://www.kickstarter.com/projects/radek-ignatow/steel-whisper">Steel Whisper</a> by Radek Ignatów — Kickstarter, launches tomorrow.</strong> Radek's entire post was "Steel Whisper start tommorow!" (I'm keeping the spelling), and it's true — it went from preview mode in last week's roundup to a September 22 launch, running through October 6. You take control of a combat mech on a desperate assault: draw the enemy in, inflict as much damage as possible, and survive long enough for resistance teams to secure desperately needed supplies.</p>

              <h2>Preview</h2>

              <p><strong><a href="https://www.kickstarter.com/projects/samkent/solo-haunting">Solo Haunting</a> by Samuel McKinney — Kickstarter, preview.</strong> New to the Launchpad. McKinney is working on his second game and says a PnP option is coming along with it: a single player ghost hunting card game where you explore a haunted house, uncover clues to identify the ghost, then expel it with a ritual — all while staying sane. There's a Tabletop Simulator playtest floating around if you want to try it early. No launch date yet.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/twoacornsgames/around-the-world-in-80-dice">Around the World in 80 Dice</a> by Two Acorns Games — Kickstarter, preview.</strong> Michał Łopato posted a full pitch of the game in the thread: a roll-&-write inspired by Jules Verne's classic, where you follow Phileas Fogg around the world, switching modes of transport, avoiding events, and collecting funds — all while racing Inspector Fix and the clock. No cutting required, and no launch date announced yet.</p>

              <h2>Ended, But Still Available</h2>

              <p><strong><a href="https://gamefound.com/en/projects/giza-games/wild-fjords--runic-isles-expansions">Wild Fjords &amp; Runic Isles Expansions - Iron Quest</a> by Giza Games — Gamefound, late pledge open.</strong> Zion Wu's post is the good news for people who blinked: the expansion campaign ended September 14, but the late pledge is open now, and you can still grab the full game with the maps and exclusive content. I flagged it on the Launchpad today.</p>

              <p><strong><a href="https://gamefound.com/en/projects/florianfiedler/roll-4-more-rum">Roll 4 MORE Rum!</a> by Florian Fiedler — Gamefound, ended.</strong> Florian posted that he's "pretty proud" of this one, and it's the expansion to his Roll4Rum world: deeper mechanics, specialized crew, and a brand-new way to command your ship — not just a map, but a career on the high seas. The campaign wrapped up in July, but the link is still live. He also reminded folks of <a href="https://gamefound.com/en/projects/florianfiedler/essence-the-grim-expeditions">Essence: The Grim Expeditions</a> from February, a tactical legacy-style dice crawler that's still worth a look.</p>

              <p><strong>Bottom line:</strong> today's thread is all about timing. Of Wheat &amp; Wonders ends today, Midway 1022 has 72 hours left, and Steel Whisper launches tomorrow — so there's an action item on all three. If you've got one click to spare right now, jump on Of Wheat &amp; Wonders before the clock runs out, and put Steel Whisper on your radar for the 22nd.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>

        ${PNPL.footer()}
