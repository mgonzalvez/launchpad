<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
    <link rel="shortcut icon" href="../assets/logo.svg" />
    <title>What's New on the Launchpad, October 2, 2026</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/app.js"></script>
    <script src="../assets/search.js"></script>
    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/pnp-collage-3x3-live-oct-2.png?v=20261002a" alt="3x3 collage featuring Roll Breakers, Lords of the Dungeon, Steel Whisper, Forgotten Paths, Ghost Kitchen, Froggycino, Word Dungeon Two, Dice Commandos, and Outside the Wire." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: October 2, 2026</p>
              <h1>What's New on the Launchpad, October 2, 2026</h1>

              <p><strong>The Launchpad is at its busiest this week, and I'm not complaining about it.</strong> Nine campaigns are in the mix — four live, two launching within five days, two in preview, and one that just closed — all of them in the collage above. If you've been hunting for a PnP project to back, or at least to play from a digital PDF, this is the lineup, in order of urgency.</p>

              <p><strong>Steel Whisper by Radek Ignatow is live, ends in <span class="days-left" data-end-date="2026-10-06"></span>, and it's a mech game with the right kind of desperation baked in.</strong> You're piloting a combat mech on a desperate assault: draw the enemy in, inflict as much damage as you can, and survive long enough for the resistance to secure supplies. Draw-driven combat with a ticking clock is the whole pitch, and it's exactly the pressure a rescue mission should have. <a href="https://www.kickstarter.com/projects/radek-ignatow/steel-whisper">Steel Whisper on Kickstarter</a>.</p>

              <p><strong>Forgotten Paths by Spiros Kallos and Tabletop for World is still live with <span class="days-left" data-end-date="2026-10-08"></span>, and every stretch goal is unlocked.</strong> It's a solo print-and-play campaign, but the choices-matter pitch is real: you're a Mistwalker on the Misty Isle and the Storybook guides you through your adventure. The creator reported all stretch goals hit, which means the lowest price is right now — exactly when you buy a PnP you already know you'll want to play.</p>

              <p><strong>Word Dungeon Two by Joe Shimwell is live through <span class="days-left" data-end-date="2026-10-12"></span>, and it's a fresh three maps in the Word Dungeon universe.</strong> Rumpledonk's Ruins, Dragon's Castle, and A Day at the Zoo, because of course a word dungeon needs a zoo. A map drop like this is the kind of thing that makes you want to dig out the base game tonight.</p>

              <p><strong>Dice Commandos: Infestation ends today, and if you've been mulling it, the clock is the argument for you.</strong> The second entry in Cole Munro-Chitty's tactical dice puzzle series from Best with One: elite commandos, an evolving alien threat, and dice that decide who makes it out. It's a Solo Game of the Month on Gamefound, and it plays in exactly the kind of short session that keeps a campaign stack from dying in the box. <a href="https://gamefound.com/en/projects/gabe-barrett/dice-commandos-2">Dice Commandos: Infestation on Gamefound</a>.</p>

              <p><strong>Roll Breakers by Alexz Martínez and RAWR! Games launches October 6, and the pitch is the most honest on the board this week: if you liked Balatro, check out Roll Breakers.</strong> Six different classes, 216 unique skills, and roguelike progression on top of a numbers-up engine. 216 skills is a lot of content to ship in a print-and-play card game, and it's the kind of depth that Balatro proved people will actually use, not just admire in a box shot. <a href="https://www.kickstarter.com/projects/rawrgames/roll-breakers">Roll Breakers on Kickstarter</a>.</p>

              <p><strong>Lords of the Dungeon: A Roll &amp; Build Print and Play Game by Keepers of Fun launches October 9, and I genuinely want to see how a Random Production system feels in a roll-and-write.</strong> Draft dice, build rooms, and become the richest lord in the dungeon. The creator calls it the only roll-and-write with Random Production mechanics, which is precisely the kind of design quirk I want to verify in play rather than take on faith. <a href="https://www.kickstarter.com/projects/keepersoffun/lords-of-the-dungeon-a-roll-and-build-print-and-play-game">Lords of the Dungeon on Kickstarter</a>.</p>

              <p><strong>Froggycino by Kinroku is previewing, and the creator says it's launching next week.</strong> It's a cozy print-at-home game of coffee and frog magic, which is the tonal counterweight to every mech and dungeon in this batch. Cozy cafés are rare in PnP, and if you've been playing a lot of grim wars this month, this is the one to put on the list. <a href="https://www.kickstarter.com/projects/kinroku/froggycino">Froggycino on Kickstarter</a>.</p>

              <p><strong>Ghost Kitchen: Trial by Fire by Beaverlicious Games is previewing as a DPnP project, and the concept is immediately legible: race through a chaotic, burning kitchen to fulfill outrageous Frankenstein-style food orders.</strong> Race games live or die on whether the pressure actually feels real, and the kitchen-fire artwork is already doing half the selling for them. Worth keeping on the radar. <a href="https://gamefound.com/en/projects/beaverlicious-games/ghost-kitchen">Ghost Kitchen on Gamefound</a>.</p>

              <p><strong>Outside the Wire by Christopher Roberson and Kazmo Studios ended October 1, so it's the one with the shortest window to give a look.</strong> It's a tactical sandbox tabletop RPG about modern military operations, solo or group play, built around a decision-making campaign ecosystem. There's no late-pledge window listed, but a campaign framework that leans into modern-war decision weight is exactly the niche I want to see explored in PnP. <a href="https://www.kickstarter.com/projects/1331624804/outside-the-wire/description">Outside the Wire on Kickstarter</a>.</p>

              <p><strong>The bigger picture: the full live rail is sitting at 30 campaigns right now, and these nine are just the top of it.</strong> Behind the collage, the rail has Avast ye Buccaneers &amp; Cutthroats, Quest-O-Graphics Vol. 2, and Kosmo Taktiks all running out in 3 days, Spartan Speech and OR ELSE! in 2, and the rest spread across a 5-to-14 day window with a Kickstarter and Gamefound tail stretching past October 20. The rail has never felt more varied, and that's a good problem to have for a player who can't commit to exactly one campaign.</p>

              <p><strong>Bottom line:</strong> if you want to back something this week, Steel Whisper and Forgotten Paths are the two with the shortest runways, and both of them are strong. Roll Breakers and Lords of the Dungeon are worth setting a calendar reminder for, because a Balatro-style engine with 216 skills and a roll-and-write with Random Production mechanics are exactly the kind of things I want in my print stack. And if you've been sitting on the fence about PnP crowdfunding in general — nine active options on one page, with twenty-one more behind them. That's the kind of week it is.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
        </main>
        ${PNPL.footer()}
      `;
      document.querySelectorAll('.days-left[data-end-date]').forEach((node) => {
        const iso = String(node.getAttribute('data-end-date') || '');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const now = new Date();
        const end = new Date(`${iso}T23:59:59`);
        const days = Math.ceil((end.getTime() - now.getTime()) / (24 * 60 * 60 * 1000));
        if (days < 0) {
          node.textContent = 'ended';
        } else if (days === 0) {
          node.textContent = 'ends today';
        } else if (days === 1) {
          node.textContent = '1 day left';
        } else {
          node.textContent = `${days} days left`;
        }
      });
      PNPL.setMainLinksNewTab();
    </script>
  </body>
</html>
