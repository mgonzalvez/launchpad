    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/blog-collage-facebook-may-30.jpg?v=20260530a" alt="3x3 collage featuring Mïnomancer, Dragon vs. Kingdom 2nd Edition, Bravery, Flock and Squabble, Roll Breakers, 7 to Midnight, Flipping Fortune, 100 Little Dungeons, and Hidden Realms: The Mummy's Tomb." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: May 30, 2026</p>
              <h1>PnP Projects from the Facebook Group, May 30, 2026</h1>

              <p><strong>The PnP Hideaway's weekly self-promotion thread was packed this week, with creators posting across every stage of the crowdfunding lifecycle.</strong> We've got a campaign in its final hours, a brand-new launch, a couple of upcoming drops, and a late-pledge window that keeps going. I cross-referenced everything against the Launchpad and here's the breakdown.</p>

              <p><strong><a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer: Roll em Bones!</a> by Robin Metz (Beaverlicious Games) — Gamefound, ended May 26.</strong> Robin posted in the group noting the campaign entered its last 24 hours. The solo roll-and-write dungeon crawler where you raise a skeletal army and fight 15+ bosses across configurable dungeon levels — it was one of the most anticipated launches of the month. The campaign has wrapped now, so if you backed, you're in. If you didn't, keep an eye out for a late-pledge window or Backerkit.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/herrgoldberg/flipping-fortune">Flipping Fortune</a> by Georg Fischer — Kickstarter, ended May 26.</strong> Georg posted "only hours until the campaign ends!" and that ship has sailed. The quirky push-your-luck tarot card game with deckbuilding elements closed a few days ago. It's still worth a look in the archive if the tarot angle appeals to you.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/radek-ignatow/bravery">Bravery</a> by Radek Ignatów — Kickstarter, launching June 9.</strong> Radek posted about his "ultimate survival game" coming soon. A card-based wilderness survival experience — not live yet, but the Kickstarter page is up and taking pre-support. If you like the survival genre, this one is worth a watch.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/rawrgames/roll-breakers">Roll Breakers</a> by Alexz Martínez (RAWR! Games) — Kickstarter, preview.</strong> "If you like watching your numbers go up, check out Roll Breakers!" is how Alexz pitched it in the group. It's in preview mode on Kickstarter right now — no launch date yet — but the page is live and the hook is clear. An engine-building roll game where your score just keeps climbing. This one is on the Launchpad as a preview.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/1896208066/dragon-vs-kingdom-2">Dragon vs. Kingdom 2nd Edition</a> by Chris Backe (Shiny Pigeon Printables) — Kickstarter, launched May 25, ends June 12.</strong> Chris posted "...and we are LIVE!" with the second edition of his dual-role pass-and-play game. Nine ways to play, hex grid action, and the core tension is beautifully simple: the Kingdom scores points by building stuff, the Dragon scores points by burning it all down. It's the kind of asymmetric head-to-head pitch that makes you want to grab a friend and play immediately. Fresh on the live rail with 14 days left.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/tholen/flock-and-squabble">Flock and Squabble</a> by Shane Thol — Kickstarter, ends May 31.</strong> Shane posted about the Micro May print-and-play: a fast, fun family game where you slap down bids on piles of rubbish. Two days left. If you've been meaning to grab a light card game for the table, this is one of the easiest low-risk picks on the rail right now.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/nukazombee/iron-protocol-exodus">Iron Protocol: Exodus</a> by NukaZombee Games — Kickstarter, ends May 31.</strong> Denis's team posted a call to "join the Resistance Corps." The compact solo sci-fi tactical combat game — mech deployment, survivor extraction, hostile territory — also has two days left. One of the heaviest tactical pitches on the site, and it's in its final stretch.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/qtgames/7-to-midnight-card-game">7 to Midnight</a> by Bob Whitely (QT Games LLC) — Kickstarter, launching June 16.</strong> A cute horror set-collection card game with free bonuses: The Midnight Showdown Battle Game and a mini comic/lore book. Bob posted the launch date in the group. Not live yet, but the page is up and you can follow it. If horror-adjacent family games are your thing, mark the calendar.</p>

              <p><strong><a href="https://www.backerkit.com/c/projects/whatifgames/100-little-dungeons">100 Little Dungeons</a> by Joe Shimwell (What If? Games) — Backerkit, ended May 28.</strong> Joe posted "just a day left" a few days ago, and the campaign has since closed. The Backerkit pledge manager is the final stop for this one — if you backed the original Kickstarter and want to sort your rewards, the window is winding down.</p>

              <p><strong><a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy's Tomb</a> by Spiros Kallos (Tabletop for World) — Gamefound, ended May 18 (late pledge ongoing).</strong> Spiros posted that they're "keeping sending files every Saturday" for anyone interested. The single-page roll-and-write dungeon crawl inspired by classic D&amp;D maps — draw polyomino shapes to map a new dungeon every game, uncover treasure, face deadly guardians. The late-pledge window is still open, which is generous.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/keepersoffun/dungeon-legacy-a-roll-and-crawl-pnp-adventure">Dungeon Legacy: A Roll &amp; Crawl PnP Adventure</a> by Nezih Savı (Keepers of Fun) — Kickstarter, ends June 10.</strong> Nezih posted that he's already started working on the next map. The campaign is fully funded and has 12 days left. A roll-and-crawl dungeon adventure with just a few sheets and three dice — and the designer is already iterating on more content. That's the kind of momentum that makes you want to back.</p>

              <h2>Quick Live Rail Check</h2>

              <p><strong>There are 10 campaigns live right now, and four of them end in just two days.</strong> The May 31 cluster — Shinobi Spy &amp; Supply, Flock and Squabble, Iron Protocol: Exodus, and Bee The Buzz — is the one to watch if you've been sitting on the fence. EFS: The Universal Voting Game closes June 4, Midtown Mall June 6, and the rest have a comfortable two-week runway. Dragon vs. Kingdom 2nd Edition is the freshest entry, launching May 25 with 14 days of runway left.</p>

              <p><strong>Bottom line:</strong> if you're only clicking one or two links today, prioritize the May 31 cluster. Flock and Squabble is the lightest grab, Iron Protocol: Exodus is the deepest tactical experience, and Dragon vs. Kingdom 2nd Edition is the strongest new launch this week. The Facebook group keeps proving it's the best pulse on what's happening in PnP crowdfunding — every single week, more names, more projects, more momentum.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
