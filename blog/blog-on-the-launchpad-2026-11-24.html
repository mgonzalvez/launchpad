<html lang="en">

    <title>What's New on the Launchpad, November 24, 2026 | PnP Launchpad</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/app.js"></script>
    <script src="../assets/search.js"></script>
    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main id="main">
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/pnp-collage-3x3-live-nov-24.jpg?v=20261124a" alt="3x3 collage featuring Case Blue, Write the Future, Midtown Casino, Around the World in 80 Dice, The 80s vs Evil, Return to SYND'R, One Page Quest, Biozero Tokyo, and Atlas Rush." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: November 24, 2026</p>
              <h1>What's New on the Launchpad, November 24, 2026</h1>

              <p><strong>Two campaigns went live today and nineteen are running right now.</strong> That's the most simultaneous print-and-play activity I've tracked on this site in a long time, and the nine projects in the collage above are the ones worth your attention this week — one of them closes tomorrow, so read in order of urgency.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/105281170/case-blue-a-ww2-roll-and-write-game">Case Blue</a> from Solo Wargame ends <span class="days-left" data-end-date="2026-11-25"></span>, and it's the one to decide on today.</strong> Martin Melbardis commands the German 1942 offensive toward Stalingrad and the Caucasus oilfields in a solo roll-and-write wargame. Melbardis already proved the format works with <a href="https://www.kickstarter.com/projects/105281170/fliegerkorps">Fliegerkorps</a>, which is sitting in late pledge right now, so this is a designer who knows how to make dice-and-pencil warfare flow instead of bogging down in bookkeeping. Roll-and-write plus a historical operation with a hard deadline is a natural pairing: the clock is the tension.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/twoacornsgames/around-the-world-in-80-dice">Around the World in 80 Dice</a> from Two Acorns Games launched today and runs through <span class="days-left" data-end-date="2026-12-08"></span>.</strong> You race against the clock like Phileas Fogg, and the "no cutting required" line matters more than it sounds — a roll-and-write you can print and play without scissors or card sleeves is a much easier sell to a family that wants to play tonight rather than this weekend. Round-and-write travel racing is a comfortable genre, and the appeal here is brisk play plus a theme that reads well on paper.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/jasongreeno/the80svsevil">The 80s vs Evil</a> by Jason Greeno also launched today, with no end date listed yet.</strong> It's a standalone Dungeon Pages solo roll-and-write: unlikely heroes, an 80s monster showdown, and digital print-and-play with faster gameplay. Greeno's Dungeon Pages work has a loyal following precisely because the system is lean — one page, real decisions, no assembly. If you like solo dungeon crawlers that fit on a single sheet, this is squarely in that lane.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/allornonegames/write-the-future-a-roll-and-write-odyssey">Write the Future: A Roll &amp; Write Odyssey</a> from All Or None Games has <span class="days-left" data-end-date="2026-12-02"></span> and the most ambition on this list.</strong> Campaign-based cyberpunk roll-and-write: tons of dice, tough decisions, a huge debt, and a shot at redemption. That debt hook is what makes it interesting. A roll-and-write with a persistent campaign and consequences that carry between sessions is a different animal from a one-and-done score sheet, and it's the kind of thing you play over a month rather than an evening.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/dozensofus/casino-central-a-casino-flip-and-write-game">Midtown Casino</a> from Dozens of Us is live through <span class="days-left" data-end-date="2026-12-08"></span>.</strong> A solo flip-and-write where you run the casino yourself. "Flip and write" is a fun twist on the roll-and-write formula — you get a card-driven setup and then have to manage it with a pencil. Note the Kickstarter URL still uses the earlier "Casino Central" name, so the campaign appears to have been renamed after launch. Same game, same page; just don't get confused when you search for it.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/nightbirdgames/return-to-syndr">Return to SYND'R</a> from Nightbird Games runs through <span class="days-left" data-end-date="2026-12-11"></span>.</strong> A solo goblin couriering game: deliver packages in a world gone wrong, one suspicious package at a time. The premise is the draw here. Courier games already have a satisfying loop of route planning and risk management, and filtering it through unreliable packages in a broken world gives the routine a reason to keep surprising you.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/grammesedition/one-page-quest">One Page Quest</a> by Léandre Proust (Grammes Edition) has been live since November 3 and still has no end date on file.</strong> Endless solo print-and-play adventures that look like an old-school RPG, play like a roguelike, and roll like Yahtzee — that's the creator's own pitch, and it's an accurate one. There's a free demo and full rules on BoardGameGeek, so you can test it before backing anything. That's the low-risk entry point on this list: print the demo, see if the dice engine clicks, then decide.</p>

              <p><strong><a href="https://www.gamefound.com/en/projects/giza-games/biozero-tokyo">Biozero: Tokyo</a> from Giza Games (design by Zion Wu) is the Gamefound entry on this board, live since November 16 with no end date listed.</strong> Solo survival: fight across an infected Tokyo, scavenge weapons, battle zombies, and find a route out before it closes. It's the most straightforwardly cinematic pick of the nine, and survival games like this work when scavenging and route choice force real trade-offs instead of just dice math. Worth checking the rules preview before backing.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/b-up-games/atlas-rush">Atlas Rush</a> from B+Up Games is the biggest multiplayer one here, live through <span class="days-left" data-end-date="2026-12-10"></span>.</strong> A strategic sci-fi print-and-play for 1–4 players: pilot a faction across real locations in our solar system, collect resources, modify dice rolls, build settlements, and race to activate the warp gates. Dice modification is the mechanic I'd want to see first — being able to change your roll is a much more interesting decision than accepting it, and it turns a resource engine into a timing game. Also a solo mode, which makes it a reasonable pick for both table types.</p>

              <p><strong>Also new in the preview queue: <a href="https://www.kickstarter.com/projects/1501566901/the-kings-charter">The King's Charter</a> from OnePage Creations.</strong> A strategic polyomino roll-and-write medieval city builder for 1 to 4+ players with nine asymmetric player roles and a four-week solo campaign. No dates announced yet, but polyominoes plus asymmetric roles is a strong combination — the roles give the roll-and-write structure something to argue about.</p>

              <p><strong>The live rail: 19 campaigns running right now.</strong> Beyond the nine above, the shelf includes <a href="https://www.kickstarter.com/projects/nobilepress/pro-patria-mori-high-seas">Pro Patria Mori: High Seas</a> (ends Nov 28), <a href="https://gamefound.com/en/projects/rayboxgames/afrikakorpse-41">AfrikaKorpse '41</a> and <a href="https://www.kickstarter.com/projects/marcosalogni/depth-print-and-play">Depth</a> (Dec 2–3), <a href="https://www.kickstarter.com/projects/bumblebros/bumble-burglars/description">Bumble Burglars</a>, <a href="https://www.kickstarter.com/projects/titanboardgames/soccer-manager-print-and-play-boardgame">Soccer Manager</a> and <a href="https://gamefound.com/en/projects/baseraider/bug-out-escape-your-paranoia">Bug Out: Escape your Paranoia</a> (Dec 4), <a href="https://www.kickstarter.com/projects/slimstudio/scattered-nexus-solis-wars">Scattered Nexus: Solis Wars</a> and <a href="https://www.kickstarter.com/projects/msm-gameworks/prairie-dog-poker/">Prairie Dog Poker</a> (Dec 10–12), <a href="https://www.kickstarter.com/projects/printandgame/neon-blood-retro-pnp-action-rpg">Neon Blood</a> and <a href="https://gamefound.com/en/projects/gabe-barrett/joe-klipfel-presents-solo-game-of-the-month">Joe Klipfel Presents [Solo Game of the Month]</a> (Dec 12–18).</p>

              <p><strong>Closed in the last couple of weeks:</strong> <a href="https://www.kickstarter.com/projects/adamebell/the-locked-room-murder-mystery-game">The Locked Room Murder Mystery Game</a> and <a href="https://www.kickstarter.com/projects/rajarjit/payload/description">Payload</a> (Nov 19), <a href="https://www.kickstarter.com/projects/nukazombee/lands-of-legacy-egypt">Lands of Legacy: Egypt</a>, <a href="https://www.kickstarter.com/projects/mattwhite-wargames/until-the-bitter-end-game-3">Until the Bitter End Game 3</a> and <a href="https://www.kickstarter.com/projects/rollnwriterevolution/rock-paper-scissors-slam">Rock Paper Scissors Slam!</a> (Nov 17), <a href="https://gamefound.com/en/projects/jason-anarchy/wholesome-adventure">Wholesome Adventure</a> (Nov 11). If one of those landed on your desk and you missed it, the late pledge pages are worth a look.</p>

              <p><strong>Bottom line:</strong> Case Blue is the decision with a deadline — it ends tomorrow, and Melbardis's solo wargames are the safest bet in that niche. Around the World in 80 Dice is the easiest first back of the day because there's nothing to cut and nothing to assemble. If you want something that will keep you at the table into December, Write the Future or Atlas Rush are the two with real campaign depth.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
        </main>
        ${PNPL.footer()}
      `;
      document.querySelectorAll('.days-left[data-end-date]').forEach((node) => {
        const iso = String(node.getAttribute('data-end-date') || '');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const now = new Date();
        const end = new Date(`${iso}T23:59:59`);
        const days = Math.ceil((end.getTime() - now.getTime()) / (24 * 60 * 60 * 1000));
        if (days < 0) {
          node.textContent = 'ended';
        } else if (days === 0) {
          node.textContent = 'ends today';
        } else if (days === 1) {
          node.textContent = '1 day left';
        } else {
          node.textContent = `${days} days left`;
        }
      });
      PNPL.setMainLinksNewTab();
    </script>
  </body>
</html>
