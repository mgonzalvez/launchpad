          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/pnp-collage-3x3-live-sep-7.png?v=20260907a" alt="3x3 collage featuring Of Wheat & Wonders, Forgotten Paths, Steel Whisper, Roll Breakers, Lords of the Dungeon, Overclock, Moon Garden, Six Eyes, and Kosmo Taktiks." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: September 7, 2026</p>
              <h1>PnP Projects from the Facebook Group, September 7, 2026</h1>

              <p><strong>The PnP Hideaway self-promotion thread delivered a solid round of creator submissions today, and the lineup is worth a look.</strong> Two campaigns are launching tomorrow, one is wrapping up its final hours, and a couple of previews are making noise. I cross-referenced everything against the Launchpad and here's the breakdown.</p>

              <p><strong><a href="https://gamefound.com/en/projects/beaverlicious-games/of-wheat-wonders-the-little-solitaire-civilization-game-dynamic-pnp-of-the-month-gamebook">Of Wheat &amp; Wonders</a> by Robin Metz (pagepunk) — Gamefound, launching September 8.</strong> Robin posted "Finally... we're launching tomorrow!" and the wait is almost over. Of Wheat & Wonders is a dynamic solo civilization game where you generate maps, gather resources, expand settlements, and unlock advancements across a 15-year reign shaped by unexpected disasters. It's powered by an online configurator that lets you customize gameplay, design your own scenarios, and generate randomized maps — so no two sessions look the same. The Gamefound campaign runs through October 7.</p>

              <p><strong><a href="https://gamefound.com/en/projects/tabletop-for-world/forgotten-paths">Forgotten Paths</a> by Spiros Kallos (Tabletop for World) — Gamefound, launching September 8.</strong> Spiros posted that this one is going live in an express campaign, with less than a day to go. Forgotten Paths is a solo print-and-play dungeon crawler where you play as a Mistwalker exploring the Misty Isle — complete quests, purchase items, unlock talents, and let the Storybook guide you through your adventure. Spiros noted they have more than 600 followers in the group, so this one has built-in momentum heading into launch.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/105281170/steel-whisper">Steel Whisper</a> by Radek Ignatów — Kickstarter, preview.</strong> Radek posted a countdown: two weeks until launch. Steel Whisper is a compact solo mech assault game where you draw the enemy in, inflict maximum damage, and survive long enough for resistance teams to secure supplies. It's got a gritty dieselpunk aesthetic and a tense risk-reward loop that should translate well to print-and-play. The Kickstarter page is up but the campaign hasn't gone live yet — this one is worth a follow if you're into tactical solo mech games.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/rawrgames/roll-breakers">Roll Breakers</a> by Alexz Martínez (RAWR! Games) — Kickstarter, preview.</strong> Alexz pitched it with a hook that should resonate: "If you liked Balatro, check out Roll Breakers." Six different classes, 216 unique skills, and roguelike progression. It's a numbers-up game where you watch your scores climb, and the Balatro comparison is a useful shorthand — if you enjoyed the loop of building combos and chasing higher numbers, this is in that neighborhood. Preview mode on Kickstarter right now, no launch date yet.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/keepersoffun/lords-of-the-dungeon-a-roll-and-build-print-and-play-game">Lords of the Dungeon: A Roll &amp; Build Print and Play Game</a> by Keepers of Fun — Kickstarter, preview.</strong> Nezih posted that the tutorial video is up and there are three weeks left to launch. Lords of the Dungeon is a roll-and-write dungeon builder where you draft dice, build rooms, and compete to become the richest lord in the dungeon. It features a Random Production mechanism that Nezih calls "probably the only roll-and-write" with that kind of system. The campaign is in preview, so the page is live and you can follow it.</p>

              <p><strong>Not on the Launchpad yet:</strong> <a href="https://arheru.itch.io/beneath">Beneath</a> by arheru — Itch.io. Henrik Lysell shared this one in the group. It's a clean, compact procedural dungeon crawler with fun dice mechanics and lots of decisions to make. Henrik describes it as "Warhammer Quest 95 or d100 Dungeon in a small format" — play one hero, make choices based on items and stats, and try to survive the procedural runs. It's free on Itch.io and not yet on the Launchpad, so if you want it tracked, it's worth a submit.</p>

              <h2>Quick Live Rail Check</h2>

              <p><strong>The live rail is holding steady with campaigns from Kosmo Taktiks through Cloaked Cryptids, and the variety keeps getting better.</strong> Of Wheat & Wonders and Forgotten Paths join the rail tomorrow, which is a nice double-header for Gamefound fans. The next few days should be a good one for the site.</p>

              <p><strong>Bottom line:</strong> tomorrow's launch pair — Of Wheat & Wonders and Forgotten Paths — are the ones to watch. Both are Gamefound, both have built-in audiences, and both bring different flavors to the solo PnP space. If you're picking just one to follow right now, Of Wheat & Wonders is the stronger hook: a dynamic civilization game with a configurator that promises replayability beyond a single run.</p>
