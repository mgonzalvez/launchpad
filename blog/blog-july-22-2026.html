    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/blog-collage-july-22-2026.jpg" alt="3x3 collage featuring Medieval Command, Master of Coin, Battlestations: Lightspeed, Shadowdark Triple Feature, and Thief in Da Building." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: July 22, 2026</p>
              <h1>5 New Additions — Medieval Command, Master of Coin, and More</h1>

              <p><strong>Five new projects have hit the Launchpad in the last few days, and three of them are already live on Kickstarter.</strong> The live rail is sitting at 12 campaigns right now — not a record, but solid, and the variety keeps getting better. Today's batch covers solo wargaming, cooperative starship action, coin-flipping kingdom management, and a Shadowdark adventure bundle. Plus a couple of previews worth watching.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/105281170/medieval-command-battle-of-varna-1444">Medieval Command: Battle of Varna, 1444</a> by Martin Melbardis launches today.</strong> This is a solo print-and-play wargame about the final European Crusade against the Ottoman Empire, and it's the kind of historical niche that Melbardis has been carving out for himself for years. The pitch is tense — you're leading the crusade, managing your forces, and trying to take Varna before the Ottomans crush you. Kickstarter runs July 22 through July 30. If you've followed Melbardis's other solo wargames on the site, you know what to expect: tight mechanics, historical flavor, and a design that respects your time. This one fits right in.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/postmarkgames/master-of-coin">Master of Coin</a> by Rory Muldoon of Postmark Games went live July 21.</strong> Postmark Games has been quietly building a catalog of well-designed, printer-friendly games, and Master of Coin is a new direction for them. The hook is simple and clever: you flip real coins to manage the economy of a fledgling fantasy kingdom and try to earn the title of Master of Coin. It's the kind of physical-mechanic twist that makes print-and-play special — the coin flip is the game, not just a substitute for a die. Kickstarter, ends August 2.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/gorillagames/battlestations-lightspeed/description">Battlestations: Lightspeed</a> by Jeffrey Siadek is another July 21 launch.</strong> This one's a cooperative board game for 1 to 4 players set in space, and the pitch is straightforward heroic starship action. Jeffrey Siadek is designing and publishing this one himself, which is a bold move for a co-op space game, but the Kickstarter page looks polished and the scope feels right for the PnP model. Ends August 11.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/josephrlewis/shadowdark-triple-feature/description">Shadowdark Triple Feature</a> by Joseph R. Lewis is a bundle of three one-shot adventure zines designed for use with Shadowdark RPG.</strong> If you're a Shadowdark player, this is a no-brainer — three ready-to-play adventures that you can print and run at the table immediately. The Kickstarter runs July 14 through July 28, so it's already live and halfway through its campaign. Lewis has been active in the Shadowdark community, and this feels like a natural extension of that work.</p>

              <p><strong><a href="https://www.kickstarter.com/projects/michalkujawa/thief-in-da-building?ref=discover_saved_projects&amp;category_id=34">Thief in Da Building</a> by Michał Kujawa has been live since July 11 and is worth a look if you like asymmetric chase games.</strong> You play as either a police officer or a thief, and the goal is simple: catch the thief before he robs the entire block, or rob the whole block before the cops catch you. It's a print-and-play chase game with a cartoonish aesthetic that looks like it'd be fun at a game night. Kickstarter through August 7.</p>

              <p><strong>Two previews are also worth flagging.</strong> <a href="https://www.kickstarter.com/projects/jaraguagames/theundervaults">The Undervaults</a> (Gabriel Arjona / Jaragua Games) is described as a solo roll-and-write dungeon crawler where a guided companion handles the bookkeeping — basically the paper you love, minus the bookkeeping you don't. And <a href="https://gamefound.com/en/projects/papertigers/miskatonic-expeditions">Miskatonic Expeditions</a> (Paper Tigers) is a Lovecraftian tile-laying roguelite with deck-building elements for 1 to 4 players. You draft rooms of an ever-shifting university, fight things from the Great Beyond, and perform the Unveiling Ritual to banish the All-in-One. Both are still in preview mode — no dates announced yet.</p>

              <p><strong>The live rail today has 12 campaigns.</strong> A few are wrapping up soon — <a href="https://www.kickstarter.com/projects/witchy/folk-horror-tarots/description">Folk Horror Tarots</a>, <a href="https://www.kickstarter.com/projects/thegrinningfrog/star-marshal-the-paper-trails?ref=discover_saved_projects&amp;category_id=34">Star Marshal: The Paper Trails</a>, and <a href="https://www.kickstarter.com/projects/rapsodagames/the-cultists-challenge?ref=discover_saved_projects&amp;category_id=34">The Cultist's Challenge</a> all ended July 19 and are now in the archive. The rest have plenty of runway. The mid-to-late July batch (Delivered!, Shadowdark Triple Feature, Showrunner) closes out by July 31, and the August batch stretches through August 21.</p>

              <p><strong>Here's the full live rail, sorted by end date:</strong></p>

              <p>
                <a href="https://www.kickstarter.com/projects/rage-kage-games/delivered-card-deck/rewards">Delivered!</a> (ends July 28) ·
                <a href="https://www.kickstarter.com/projects/josephrlewis/shadowdark-triple-feature/description">Shadowdark Triple Feature</a> (ends July 28) ·
                <a href="https://gamefound.com/en/projects/gabe-barrett/showrunner-solo-game-of-the-month">Showrunner [Solo Game of the Month]</a> (ends July 31) ·
                <a href="https://www.kickstarter.com/projects/david007/stack-stealer/description">Stack Stealer</a> (ends August 1) ·
                <a href="https://www.kickstarter.com/projects/552971206/pixel-arts/description">Pixel Arts</a> (ends August 2) ·
                <a href="https://www.kickstarter.com/projects/postmarkgames/master-of-coin">Master of Coin</a> (ends August 2) ·
                <a href="https://www.kickstarter.com/projects/getyourchadon/backstab-solo-dungeon-crawler-board-game/description">Backstab — Solo Dungeon Crawler</a> (ends August 6) ·
                <a href="https://www.kickstarter.com/projects/michalkujawa/thief-in-da-building?ref=discover_saved_projects&amp;category_id=34">Thief in Da Building</a> (ends August 7) ·
                <a href="https://www.kickstarter.com/projects/gorillagames/battlestations-lightspeed/description">Battlestations: Lightspeed</a> (ends August 11) ·
                <a href="https://www.kickstarter.com/projects/millratstudio/millrat-pack">MILLRAT Pack!</a> (ends August 13) ·
                <a href="https://www.kickstarter.com/projects/yellowdicegames/glitch-the-card-game-where-everyone-slowly-malfunctions/description">GLITCH</a> (ends August 14) ·
                <a href="https://gamefound.com/en/projects/florianfiedler/pnp-bundle-1?ref=homepage_discover_upcoming-coming-soon_4">PnP Bundle #1</a> (ends August 21)
              </p>

              <p><strong>Bottom line:</strong> <a href="https://www.kickstarter.com/projects/105281170/medieval-command-battle-of-varna-1444">Medieval Command</a> is the standout new launch today — Melbardis's solo wargames are consistently the most mechanically satisfying things on the site, and Varna is a historically rich setting. <a href="https://www.kickstarter.com/projects/postmarkgames/master-of-coin">Master of Coin</a> is the most interesting new mechanic (real coin flipping for kingdom management is genuinely clever), and <a href="https://www.kickstarter.com/projects/gorillagames/battlestations-lightspeed/description">Battlestations: Lightspeed</a> fills a gap for co-op space games in the PnP space. If you're a Shadowdark player, the <a href="https://www.kickstarter.com/projects/josephrlewis/shadowdark-triple-feature/description">Triple Feature</a> bundle is an easy pick. The previews (The Undervaults, Miskatonic Expeditions) are worth keeping an eye on — both have strong pitches and I expect dates to drop soon.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
        </main>
        ${PNPL.footer()}
      `;
      PNPL.setMainLinksNewTab();
