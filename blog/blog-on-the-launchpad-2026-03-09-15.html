            <img class="blog-cover" src="../uploads/blog-collage-2026-03-09-15.jpg?v=20260309a" alt="Collage featuring KING, Hidden Realms, Mïnomancer, Fort Douaumont, Bravery, Hexoplanets, Stitchery Faire, LUDOS, and HEX FACTOR." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: March 9, 2026</p>
              <h1>What's New on the Launchpad This Week of March 9-15, 2026</h1>

              <p><strong>KING</strong> is the live campaign with the clearest urgency in this week’s thread. Radek Ignatow says it is now halfway through its Kickstarter run, which means this is the stretch where a good campaign either sharpens its momentum or gets taken for granted. If you like strategic, puzzle-forward print-and-play designs, this is the one in this week’s thread that most clearly deserves active backing attention right now.</p>

              <p><strong>Also live and newly added to Launchpad since the last roundup:</strong> <a href="https://www.kickstarter.com/projects/sneakylabgames/hex-factor/">HEX FACTOR</a>, <a href="https://www.kickstarter.com/projects/storyseamstress/stitchery-faire-a-cozy-solo-journaling-and-sketching-game/">Stitchery Faire</a>, <a href="https://www.kickstarter.com/projects/fullsauna/hexoplanets/">Hexoplanets</a>, and <a href="https://www.kickstarter.com/projects/lemerygames/ludos-the-ancient-games-collection-europe">LUDOS: The ancient games collection - Europe</a>. That is a strong spread: fast abstract competition, cozy solo storytelling, dice-and-pencil terraforming, and a pocketable historical games collection. If you have not checked Launchpad in a few days, those are the new live additions worth scanning first.</p>

              <p><strong>Coming soon projects with the strongest signals:</strong> <a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy’s Tomb</a> is now nine days from launch, and the creator is already responding to community feedback with a new interacting competitive mode variant and a fourth map as stretch goals. That is the kind of pre-launch update I like to see because it suggests the creator is listening early rather than scrambling late. <a href="https://www.kickstarter.com/projects/dadu/fort-douaumont">Fort Douaumont</a> also continues to make a strong case for itself as a small-footprint tactical design with real tension, while <a href="https://www.kickstarter.com/projects/radek-ignatow/bravery">Bravery</a> remains one to watch for survival game fans.</p>

              <p><strong>Preview watch:</strong> <a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer - Roll em Bones!</a> is the standout preview project in this week’s thread. A solo roll-and-write dungeon crawler built around raising a skeletal army, arranging polyomino formations, and pushing through multi-level dungeon runs toward one of more than fifteen bosses is a strong pitch, and it feels distinct enough to be worth following closely before dates lock in.</p>

              <p><strong>Not crowdfunding, but still worth your attention:</strong> Ra Oul Schaupp’s <a href="https://raoulschaupp.itch.io/grimm-world-isegrim">Grimm World - Isegrim, the Wolf</a> expansion is now available as a final free download with finished illustrations and proofreading complete. Charles Ward also shared <a href="https://boardgamegeek.com/thread/3489653/wip-perfect-10-fruit-salad">Perfect 10 Fruit Salad</a>, a family-weight Forever Free print-and-play entry for the 2026 Children &amp; Family Game Design Contest on BoardGameGeek. And Space Slug Games is offering a free PnP at <a href="https://www.spacesluggames.com/">spacesluggames.com</a> while building interest for the later <a href="https://www.kickstarter.com/projects/spacesluggames/station-decimus-the-push-your-luck-dice-placement-game">Station Decimus</a> Kickstarter. None of those are current crowdfunding campaigns, but they are exactly the kind of adjacent finds this community should know about.</p>

              <p><strong>Bottom line:</strong> KING is the live campaign in this week’s thread with the strongest immediate call to action, Hidden Realms and Fort Douaumont are the coming-soon projects with the best early momentum, and Mïnomancer is the preview project most likely to earn a bigger audience if people keep following and sharing it. On top of that, the thread also delivered a few very solid non-crowdfunding finds, which is part of what makes these weekly promotion posts worth reading in the first place.</p>
