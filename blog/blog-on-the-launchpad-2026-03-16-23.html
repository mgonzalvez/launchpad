<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
    <link rel="shortcut icon" href="../assets/logo.svg" />
    <title>What's New on the Launchpad This Week of March 16-23, 2026 | PnP Launchpad</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/app.js"></script>
    <script src="../assets/search.js"></script>
    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/blog-collage-2026-03-16-23.jpg?v=20260321a" alt="3x3 collage featuring Forage + Honeypot, Fort Douaumont, What If...WARS, Hexoplanets, Cat Saga, Hidden Realms, Dino Farmers, Sole Survivor, and Play With Fire." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: March 21, 2026</p>
              <h1>What's New on the Launchpad This Week of March 16-23, 2026</h1>

              <p>Launchpad picked up a good mix of live campaigns, fresh preview listings, and a few notable upcoming projects this week. There is also at least one campaign that does not need more procrastination from any of us: <strong>Forage + Honeypot</strong> is on its last legs, so if you have been meaning to back that one, this is the moment to stop “meaning to” and actually do it.</p>

              <p><strong>Ending soon, and worth acting on:</strong> <a href="https://www.kickstarter.com/projects/flatoutgames/forage-honeypot/description">Forage + Honeypot</a> is effectively at the wire, with <span class="days-left" data-end-date="2026-03-20">time left</span>. This is an easy recommendation if you like polished, approachable designs with real replay value. <strong>Fort Douaumont</strong> is not far behind, with <span class="days-left" data-end-date="2026-03-27">time left</span>. I continue to like the pitch here: a small-footprint tactical design trying to do something tense and thoughtful with very little overhead. That is exactly the kind of project I want Launchpad to keep surfacing.</p>

              <p><strong>Also live right now:</strong> <a href="https://site.wargamevault.com/product/560851/WHAT-IFWars-WWII-Series?affiliate_id=3623781">What If...WARS (WWII Series)</a> is a limited-time promo for wargamers who want quick-playing, low-fuss conflict gaming with solo support and light production demands. <a href="https://www.kickstarter.com/projects/fullsauna/hexoplanets/">Hexoplanets</a> remains one of the more visually distinctive live entries on the site right now, while <a href="https://www.kickstarter.com/projects/rollingrhinogames/catsaga">Cat Saga</a> still has runway for anyone looking for a co-op story-driven print-and-play adventure. And now that <a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy's Tomb</a> has finally crossed over from “coming soon” into live status, it deserves a proper look from anyone who enjoys single-page roll-and-write dungeon crawls with a strong adventure-game hook.</p>

              <p><strong>New entries added to Launchpad since the last roundup:</strong> <a href="https://www.kickstarter.com/projects/nukazombee/dino-farmers">Dino Farmers</a>, <a href="https://bananarchylaunch.pickupandplaygames.com/">Bananarchy</a>, <a href="https://www.kickstarter.com/projects/umbrapublishing/play-with-fire-the-card-game">Play With Fire - The Card Game</a>, <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a>, <a href="https://www.kickstarter.com/projects/nonymousgames/forgetify-recall-recite-repeat-0">Forgetify</a>, <a href="https://www.kickstarter.com/projects/printandgame/path-of-bones-print-and-play-pnp-card-game-pdf?ref=discovery&term=print%20and%20play%20games&total_hits=491&category_id=34">Path of Bones</a>, and the promo listing for <a href="https://site.wargamevault.com/product/560851/WHAT-IFWars-WWII-Series?affiliate_id=3623781">What If...WARS</a>. That is a healthy spread: memory games, monkey-chaos party play, spaceship survival, fantasy skirmishing, and cave people raising dinosaurs. One of the things I like most about the current Launchpad mix is that it is not just a parade of similar fantasy dungeon crawls. There is actual variety here.</p>

              <p><strong>Upcoming projects to keep on your radar:</strong> <a href="https://www.kickstarter.com/projects/nukazombee/dino-farmers">Dino Farmers</a> launches on March 23 and looks like the next obvious one to watch if you like solo/co-op print-and-play with a playful theme. <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a> has a good clean pitch as a brutal, short solo survival challenge aboard an alien-infested spaceship. <a href="https://www.kickstarter.com/projects/umbrapublishing/play-with-fire-the-card-game">Play With Fire</a> is aiming for that strategic push-your-luck lane, and <a href="https://www.kickstarter.com/projects/nonymousgames/forgetify-recall-recite-repeat-0">Forgetify</a> gives the upcoming section a welcome change of pace with a memory-game angle instead of another combat-forward design.</p>

              <p><strong>Preview watch:</strong> <a href="https://bananarchylaunch.pickupandplaygames.com/">Bananarchy</a> and <a href="https://www.kickstarter.com/projects/printandgame/path-of-bones-print-and-play-pnp-card-game-pdf?ref=discovery&term=print%20and%20play%20games&total_hits=491&category_id=34">Path of Bones</a> are the new preview additions this week, and both are worth keeping an eye on for different reasons. Bananarchy sounds loud, fast, and gleefully mean in the best party-game sense. Path of Bones, by contrast, looks like it is going for a darker, more interactive card-game feel with a bit more edge in the presentation.</p>

              <p><strong>Bottom line:</strong> if you only click one thing after reading this, make it Forage + Honeypot before that window closes. After that, Fort Douaumont is the other live project with the clearest near-term urgency. Looking ahead, Dino Farmers is the upcoming title with the most immediate launch momentum, while Hidden Realms gets the nod this week as the newly live project most likely to draw curiosity from Launchpad regulars.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
        </main>
        ${PNPL.footer()}
      `;
      document.querySelectorAll('.days-left[data-end-date]').forEach((node) => {
        const iso = String(node.getAttribute('data-end-date') || '');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const now = new Date();
        const end = new Date(`${iso}T23:59:59`);
        const days = Math.ceil((end.getTime() - now.getTime()) / (24 * 60 * 60 * 1000));
        if (days < 0) {
          node.textContent = 'on its final day';
        } else if (days === 0) {
          node.textContent = 'ending today';
        } else if (days === 1) {
          node.textContent = '1 day left';
        } else {
          node.textContent = `${days} days left`;
        }
      });
      PNPL.setMainLinksNewTab();
    </script>
  </body>
</html>
