        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/blog-collage-2026-04-20.jpg?v=20260420a" alt="3x3 collage featuring Galen's Games Mint Tin Series 2, Pocket Puffins, Hidden Realms: The Mummy's Tomb, Sole Survivor, Dungeon Legacy, Flipping Fortune, Mïnomancer, Bravery, and Like Herding Cats." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: April 20, 2026</p>
              <h1>What's Getting Promoted in PnP Hideaway Today, April 20, 2026</h1>

              <p>Today&rsquo;s PnP Hideaway thread delivered a genuinely useful mix: final-days live campaigns, newly live low-cost PnP, May preview pages, a direct-purchase storefront update, and a professional PnP pre-order link that sits a little outside the usual Launchpad lane. I also pulled <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a> into today&rsquo;s collage because it is one of the live Launchpad projects still worth a look even though it was not part of the thread itself.</p>

              <p><strong>If you want the urgent clicks first, start with the live stuff.</strong> <a href="https://www.kickstarter.com/projects/galensgames/galens-games-mint-tin-series-2">Galen&rsquo;s Games Mint Tin Series 2</a> is in its final stretch and ends on <strong>Thursday, April 23, 2026</strong>, which makes it the clearest deadline in the thread. <a href="https://www.kickstarter.com/projects/pocket-puffins/pocket-puffins-lost-in-space-18-card-solo-space-puzzle">Pocket Puffins: Lost in Space</a> is now live with a <strong>$1 PnP pledge</strong> and a very easy-to-understand solo hook: eighteen cards, pattern matching, and a compact puzzle feel. <a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy&rsquo;s Tomb</a> is still building momentum too, now with stretch-goal talk around the relic map and duel mode, which gives the project a little more life than a standard &ldquo;campaign is still running&rdquo; reminder.</p>

              <p><strong>The non-crowdfunding links are worth noting too.</strong> <a href="https://www.rncgames.com/lhc">Like Herding Cats</a> still has professional PnP pre-orders open, which is useful for anyone who wants something more finished and store-like than a campaign pledge manager flow. And while I am not adding it as a Launchpad listing, <a href="https://www.grazingbeargames.com/">Grazing Bear Games</a> now has its own direct-purchase site live with four quick-build PnP titles. That absolutely belongs in the same conversation even if it sits outside the site&rsquo;s usual crowdfunding focus.</p>

              <p><strong>The May watchlist coming out of this thread is solid.</strong> <a href="https://www.kickstarter.com/projects/keepersoffun/dungeon-legacy-a-roll-and-crawl-pnp-adventure?utm_id=97758_v0_s00_e0_tv0">Dungeon Legacy: A Roll &amp; Crawl PnP Adventure</a> remains one of the easier pitches to understand at a glance: just a few sheets, three dice, and a dungeon crawl structure. <a href="https://www.kickstarter.com/projects/radek-ignatow/bravery">Bravery</a> still looks like the strongest pure survival-flavored pitch in this group, while <a href="https://www.kickstarter.com/projects/herrgoldberg/flipping-fortune">Flipping Fortune</a> keeps its angle simple and appealing by leaning into tarot cards, quick turns, and a strong visual identity. <a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer</a> is slated for early May and still has one of the most distinctive visual hooks in the current upcoming lane.</p>

              <p><strong>The wildcard today is Rook &amp; Ruin.</strong> <a href="https://gamefound.com/en/projects/florianfiedler/rookruin">Rook &amp; Ruin</a> got a quick teaser from Florian Fiedler about a first add-on coming, and the core pitch still stands out because it sounds like a chess-informed 1v1 deck builder rather than a straight abstract or a generic dueling card game. That is enough to keep it on the radar even before the add-on details are fully unpacked.</p>

              <p><strong>Bottom line:</strong> if you only make two clicks out of today&rsquo;s thread, make one of them <a href="https://www.kickstarter.com/projects/galensgames/galens-games-mint-tin-series-2">Galen&rsquo;s Games Mint Tin Series 2</a> before the Thursday close and the other <a href="https://www.kickstarter.com/projects/pocket-puffins/pocket-puffins-lost-in-space-18-card-solo-space-puzzle">Pocket Puffins</a> if the $1 solo puzzle entry point works for you. After that, the strongest &ldquo;watch next&rdquo; group is <a href="https://www.kickstarter.com/projects/keepersoffun/dungeon-legacy-a-roll-and-crawl-pnp-adventure?utm_id=97758_v0_s00_e0_tv0">Dungeon Legacy</a>, <a href="https://gamefound.com/en/projects/beaverlicious-games/minomancer---the-roll--write-dungeon-crawler-dynamic-pnp-of-the-month--gamebook">Mïnomancer</a>, <a href="https://www.kickstarter.com/projects/radek-ignatow/bravery">Bravery</a>, <a href="https://www.kickstarter.com/projects/herrgoldberg/flipping-fortune">Flipping Fortune</a>, and <a href="https://gamefound.com/en/projects/florianfiedler/rookruin">Rook &amp; Ruin</a>, with <a href="https://www.rncgames.com/lhc">Like Herding Cats</a> and the <a href="https://www.grazingbeargames.com/">Grazing Bear Games</a> storefront covering the direct-purchase side of the conversation.</p>
