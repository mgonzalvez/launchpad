<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
    <link rel="shortcut icon" href="../assets/logo.svg" />
    <title>What's New on the Launchpad, April 6-13, 2026 | PnP Launchpad</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="../assets/app.js"></script>
    <script>
      const el = document.getElementById('app');
      el.innerHTML = `
        ${PNPL.header('Blog')}
        <main>
          <article class="blog-post-card blog-post-full">
            <img class="blog-cover" src="../uploads/collage-latest-additions-2026-04-06.jpg?v=20260406a" alt="3x3 collage featuring Forgetify, Dino Farmers, Bananarchy, Play With Fire, BYTE: SHIFT, What If...WARS, Sole Survivor, Galen's Games Mint Tin Series 2, and Shinobi Spy & Supply." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: April 6, 2026</p>
              <h1>What's New on the Launchpad, April 6-13, 2026</h1>

              <p>Launchpad got a healthy batch of fresh additions this week, and the nice part is that they are not all chasing the same exact lane. We added <strong>Forgetify</strong>, <strong>Dino Farmers</strong>, <strong>Bananarchy</strong>, <strong>Play With Fire</strong>, <strong>Sole Survivor</strong>, <strong>Galen's Games Mint Tin Series 2</strong>, <strong>Shinobi Spy &amp; Supply</strong>, and the promo listing for <strong>What If...WARS</strong>, with <strong>BYTE: SHIFT</strong> now shifted out of preview mode and onto the real calendar.</p>

              <p><strong>The current live mix is in good shape.</strong> <a href="https://www.kickstarter.com/projects/rollingrhinogames/catsaga">Cat Saga</a> and <a href="https://www.kickstarter.com/projects/nukazombee/dino-farmers">Dino Farmers</a> are the two that feel most urgent at the moment, both with <span class="days-left" data-end-date="2026-04-15">time left</span>. <a href="https://gamefound.com/en/projects/beaverlicious-games/byte-shift-competitive-hacking-game-dpnp">BYTE: SHIFT</a> gives the live section a sharper competitive edge, <a href="https://www.kickstarter.com/projects/galensgames/galens-games-mint-tin-series-2">Galen's Games Mint Tin Series 2</a> is a very clean fit for anyone who likes small, fast 1-2 player designs, and <a href="https://gamefound.com/en/projects/tabletop-for-world/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy's Tomb</a> is still the biggest adventure-flavored entry on the board right now.</p>

              <p><strong>The newest additions are a strong mix.</strong> <a href="https://www.kickstarter.com/projects/nonymousgames/forgetify-recall-recite-repeat-0">Forgetify</a> brings a memory-game angle that stands out immediately. <a href="https://bananarchylaunch.pickupandplaygames.com/">Bananarchy</a> looks loud, chaotic, and unapologetically built for table energy. <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a> goes the other direction, leaning into short, nasty solo survival. <a href="https://www.kickstarter.com/projects/orcaislandgames/shinobi-spy-and-supply">Shinobi Spy &amp; Supply</a> has a fun premise and a low-friction $3 PnP tier, while <a href="https://site.wargamevault.com/product/560851/WHAT-IFWars-WWII-Series?affiliate_id=3623781">What If...WARS</a> gives the site a little more wargame flavor than usual.</p>

              <p><strong>Looking ahead, the upcoming lane is quietly getting stronger.</strong> <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a>, <a href="https://www.kickstarter.com/projects/umbrapublishing/play-with-fire-the-card-game">Play With Fire</a>, <a href="https://www.kickstarter.com/projects/orcaislandgames/shinobi-spy-and-supply">Shinobi Spy &amp; Supply</a>, and <a href="https://www.kickstarter.com/projects/nonymousgames/forgetify-recall-recite-repeat-0">Forgetify</a> give Launchpad a nice run of very different projects coming up over the next several weeks. That variety matters. It keeps the site from feeling like a list of interchangeable fantasy skirmish campaigns, and it gives people with very different tastes a reason to keep checking back.</p>

              <p><strong>Bottom line:</strong> the live page feels more interesting right now than it did a week ago, the new additions are doing a good job of broadening the mix, and the upcoming section has enough personality to make the next stretch worth watching closely.</p>

              <p><a href="index.html">Back to Blog</a></p>
            </div>
          </article>
        </main>
        ${PNPL.footer()}
      `;
      document.querySelectorAll('.days-left[data-end-date]').forEach((node) => {
        const iso = String(node.getAttribute('data-end-date') || '');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
        const now = new Date();
        const end = new Date(`${iso}T23:59:59`);
        const days = Math.ceil((end.getTime() - now.getTime()) / (24 * 60 * 60 * 1000));
        if (days < 0) {
          node.textContent = 'on its final day';
        } else if (days === 0) {
          node.textContent = 'ending today';
        } else if (days === 1) {
          node.textContent = '1 day left';
        } else {
          node.textContent = `${days} days left`;
        }
      });
      PNPL.setMainLinksNewTab();
    </script>
  </body>
</html>
