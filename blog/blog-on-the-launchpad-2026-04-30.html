            <img class="blog-cover" src="../uploads/blog-collage-2026-04-30.jpg?v=20260430a" alt="3x3 collage featuring Eye 2 Eye Duel, Of Wheat &amp; Wonders, Infrared, Iron Protocol: Exodus, Tribe: Harsh Lands, Greetings from Earth, Pocket Puffins, Sole Survivor, and Hidden Realms: The Mummy's Tomb." loading="lazy" />
            <div class="blog-post-body">
              <p class="meta">Published: April 30, 2026</p>
              <h1>What's New on the Launchpad, April 30, 2026</h1>

              <p><strong>Seven new projects landed on the Launchpad since the last update, and the live rail is still holding five active campaigns.</strong> The new additions span a QR-code-driven paranormal adventure, a pocket-sized western duel, a tactical mech boardgame, a micro card game about prehistoric survival, and a few quick family-friendly pitches — plus a direct-purchase listing on Itch.io that sits just outside the usual crowdfunding lane.</p>

              <p><strong>The standout new entry is Infrared,</strong> a hyper-experimental mystery game and full choose-your-own-adventure experience from Beaverlicious Games and designer Robin Metz. It lives on a single page and uses QR codes triggered by your phone camera to unlock scenes and events — no app required. It's on Gamefound and has one of the most unusual delivery mechanics I've seen in the PnP crowdfunding space. If you like games that treat your phone as part of the physical component set, this one is worth a closer look.</p>

              <p><strong>Eye 2 Eye Duel from Smart Flamingo is another quick pitch worth noting.</strong> It's a pocket-sized western duel built around bluff, dexterity, and a bit of nerve. Kickstarter, no dates announced yet — it's in preview, which means the campaign page should be coming soon. Also preview: <a href="https://www.kickstarter.com/projects/283509132/the-cats-of-new-orleans">The Cats of New Orleans</a> (Marco Pecota), <a href="https://kickstarter.com/projects/tholen/flock-and-squabble">Flock and Squabble</a> (Shane Thol, launching as part of MicroMay), and <a href="https://www.kickstarter.com/projects/nukazombee/iron-protocol-exodus">Iron Protocol: Exodus</a> (Denis Kurdiukov / NukaZombee Games). The Iron Protocol entry is a personal favorite of mine — tactical sci-fi boardgame with mech deployment, ruined suburb maps, and survivor search. It's a heavier pitch than most of the preview batch and sounds like it rewards careful planning.</p>

              <p><strong>Of Wheat &amp; Wonders</strong> rounds out the preview batch with a lighter, more whimsical angle. No dates yet, but it's another Kickstarter listing to keep an eye on. And then there's <a href="https://small-table-games.itch.io/tribe-harsh-lands">Tribe: Harsh Lands</a> by Dragos Cilibiu / Small Table Games — a strategic card-driven prehistoric survival game where you guide a fragile tribe through shifting biomes, managing drought, frost, and pestilence. It's a 24-card micro game inspired by Evo 2nd Edition, available for $2 USD directly on Itch.io. Not a crowdfunding campaign, but it absolutely belongs in the same conversation for anyone looking for a quick, replayable PnP-style purchase.</p>

              <p><strong>On the live rail, five campaigns are still running.</strong> <a href="https://www.kickstarter.com/projects/pocket-puffins/pocket-puffins-lost-in-space-18-card-solo-space-puzzle">Pocket Puffins: Lost in Space</a> (ends May 14) remains the easiest entry point at a $1 PnP pledge — eighteen cards, pattern matching, solo puzzle feel. <a href="https://www.kickstarter.com/projects/papertigers/sole-survivor-0">Sole Survivor</a> (ends May 15) is the alien-infested spaceship survival challenge that's been on the site for a couple weeks now. <a href="https://gamefound.com/en/projects/tabletopforworld/hidden-realms-the-mummys-tomb">Hidden Realms: The Mummy's Tomb</a> (ends May 18) continues building momentum on Gamefound with stretch-goal talk around the relic map and duel mode. <a href="https://www.kickstarter.com/projects/hp1/nothing-but-net-2-player-head-to-head-basketball-card-game">Nothing But Net</a> (ends May 20) is a fast two-player basketball card and dice game — draft offense and defense, execute plays, race to 21. And <a href="https://www.kickstarter.com/projects/gonzhome/greetings-from-earth">Greetings from Earth</a> (ends May 23) is the furthest out of the live group, giving you the most time to decide.</p>

              <p><strong>Bottom line:</strong> Infrared is the most inventive new addition on the site right now, and Iron Protocol: Exodus is the heaviest, most tactical pitch in the preview batch. If you're hunting for something to play today, Pocket Puffins at $1 is the lowest-risk entry, and Tribe: Harsh Lands at $2 on Itch.io is the fastest path to a complete game. The live rail stays at five projects — Pocket Puffins and Sole Survivor are the closest to closing, so those are the ones to watch if you've been waiting.</p>

              <p><a href="index.html">Back to Blog</a></p>
