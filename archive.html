<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Ended print-and-play campaigns, late pledges and pre-orders, sortable by end date, platform or priority." />
    <meta property="og:title" content="Archive | PnP Launchpad" />
    <meta property="og:description" content="Ended print-and-play campaigns, late pledges and pre-orders, sortable by end date, platform or priority." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://launchpad.gonzhome.us/archive.html" />
    <meta property="og:image" content="https://launchpad.gonzhome.us/uploads/og-launchpad.jpg" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://launchpad.gonzhome.us/archive.html" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="shortcut icon" href="assets/logo.svg" />
    <title>Archive | PnP Launchpad</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pnpl_theme_v1');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="assets/app.js"></script>
    <script src="assets/search.js"></script>
    <script>
      (async () => {
        const el = document.getElementById('app');
        const data = await PNPL.loadContent();
        const projects = PNPL.enrichProjects(data);
        const now = new Date();
        const archived = projects
          .filter((p) => ['archived', 'late-pledge', 'pre-order'].includes(PNPL.projectStatus(p, now)))
          .sort(PNPL.byArchivePriority);
        let isCompact = PNPL.getViewMode('archive.html') === 'compact';
        let currentSort = PNPL.getSortMode('archive.html');
        const ITEMS_PER_PAGE = 20;
        let displayedCount = ITEMS_PER_PAGE;
        const reducedMotion = Boolean(
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        );

        const sortOptions = [
          { value: 'endDesc', label: 'End date (newest first)' },
          { value: 'endAsc', label: 'End date (oldest first)' },
          { value: 'launchDesc', label: 'Launch date (newest first)' },
          { value: 'launchAsc', label: 'Launch date (oldest first)' },
          { value: 'titleAsc', label: 'Title (A–Z)' },
          { value: 'titleDesc', label: 'Title (Z–A)' },
          { value: 'platform', label: 'Platform' },
          { value: 'statusCategory', label: 'Status category' },
        ];

        const sortSelect = archived.length ? `
          <div class="sort-select">
            <label for="archive-sort">Sort by:</label>
            <select id="archive-sort">
              ${sortOptions.map((opt) =>
                `<option value="${opt.value}"${currentSort === opt.value ? ' selected' : ''}>${opt.label}</option>`
              ).join('')}
            </select>
          </div>
        ` : '';

        const viewToggle = archived.length ? `
          <div class="view-toggle" role="group" aria-label="View mode">
            <button type="button" class="${isCompact ? 'active' : ''}" data-view="compact" aria-pressed="${isCompact}">Compact</button>
            <button type="button" class="${!isCompact ? 'active' : ''}" data-view="full" aria-pressed="${!isCompact}">Full</button>
          </div>
        ` : '';

        el.innerHTML = `
          ${PNPL.header('Archive')}
          <main>
            <section class="hero">
              <h1>Archived Projects</h1>
              <p>Projects automatically move here after their campaign or promo end date. Projects with late pledges and pre-orders are shown first by default.</p>
              <div class="archive-controls">
                ${sortSelect}
                ${viewToggle}
              </div>
            </section>
            <p class="archive-status" id="archive-status" aria-live="polite"></p>
            <div id="archive-grid"></div>
            <div class="load-more-container" id="archive-pager"></div>
          </main>
          ${PNPL.footer()}
        `;

        if (!archived.length) return;

        const gridEl = document.getElementById('archive-grid');
        const pagerEl = document.getElementById('archive-pager');
        const statusEl = document.getElementById('archive-status');

        function getSortedProjects() {
          const sorted = [...archived];
          switch (currentSort) {
            case 'endAsc': sorted.sort(PNPL.byEndAsc); break;
            case 'endDesc': sorted.sort(PNPL.byEndDesc); break;
            case 'launchAsc': sorted.sort(PNPL.byLaunchAsc); break;
            case 'launchDesc': sorted.sort(PNPL.byLaunchDesc); break;
            case 'titleAsc': sorted.sort(PNPL.byTitleAsc); break;
            case 'titleDesc': sorted.sort(PNPL.byTitleDesc); break;
            case 'platform': sorted.sort(PNPL.byPlatform); break;
            case 'statusCategory': sorted.sort(PNPL.byStatusCategory); break;
            default: sorted.sort(PNPL.byArchivePriority); break;
          }
          return sorted;
        }

        function syncControls() {
          el.querySelectorAll('.view-toggle button').forEach((btn) => {
            const active = btn.dataset.view === (isCompact ? 'compact' : 'full');
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', String(active));
          });
          const sortEl = document.getElementById('archive-sort');
          if (sortEl) sortEl.value = currentSort;
        }

        function renderArchive() {
          const sorted = getSortedProjects();
          const shown = sorted.slice(0, displayedCount);
          const hasMore = displayedCount < sorted.length;

          gridEl.innerHTML = shown.length
            ? `<div class="grid${isCompact ? ' compact-grid' : ''}">${shown.map((p) => PNPL.projectCard(p, { compactView: isCompact })).join('')}</div>`
            : '<p>No archived projects match the current filters.</p>';
          statusEl.textContent = `Showing ${shown.length} of ${sorted.length} archived projects`;
          pagerEl.innerHTML = hasMore
            ? `<button type="button" id="load-more-btn" class="btn btn-secondary">Load more (${sorted.length - displayedCount} remaining)</button><button type="button" id="back-to-top" class="back-to-top">Back to top</button>`
            : `<button type="button" id="back-to-top" class="back-to-top">Back to top</button>`;
        }

        syncControls();
        renderArchive();

        el.querySelectorAll('.view-toggle button').forEach((btn) => {
          btn.addEventListener('click', () => {
            isCompact = btn.dataset.view === 'compact';
            PNPL.setViewMode(btn.dataset.view);
            renderArchive();
          });
        });

        const sortEl = document.getElementById('archive-sort');
        sortEl.addEventListener('change', () => {
          currentSort = sortEl.value;
          PNPL.setSortMode(currentSort);
          displayedCount = ITEMS_PER_PAGE;
          renderArchive();
        });

        pagerEl.addEventListener('click', (event) => {
          if (event.target.id === 'load-more-btn') {
            displayedCount += ITEMS_PER_PAGE;
            renderArchive();
            const next = document.getElementById('load-more-btn');
            if (next) next.focus();
          } else if (event.target.id === 'back-to-top') {
            const anchor = document.querySelector('.archive-controls') || document.body;
            anchor.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'start' });
          }
        });
      })();
    </script>
  </body>
</html>
