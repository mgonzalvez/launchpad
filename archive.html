<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="shortcut icon" href="assets/logo.svg" />
    <title>Ended | PnP Launchpad</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="assets/app.js"></script>
    <script src="assets/search.js"></script>
    <script>
      (async () => {
        const el = document.getElementById('app');
        const data = await PNPL.loadContent();
        const projects = PNPL.enrichProjects(data);
        const now = new Date();
        const archived = projects
          .filter((p) => ['archived', 'late-pledge', 'pre-order'].includes(PNPL.projectStatus(p, now)))
          .sort(PNPL.byArchivePriority);
        const defaultView = 'compact';
        const currentView = PNPL.getViewMode('archive.html');
        const isCompact = currentView === 'compact';

        const viewToggle = archived.length ? `
          <div class="view-toggle" role="group" aria-label="View mode">
            <button type="button" class="${isCompact ? 'active' : ''}" data-view="compact" aria-pressed="${isCompact}">Compact</button>
            <button type="button" class="${!isCompact ? 'active' : ''}" data-view="full" aria-pressed="${!isCompact}">Full</button>
          </div>
        ` : '';

        el.innerHTML = `
          ${PNPL.header('Ended')}
          <main>
            <section class="hero">
              <h1>Ended Projects</h1>
              <p>Projects automatically move here after their campaign or promo end date. Projects with late pledges and pre-orders available are shown first.</p>
              ${viewToggle}
            </section>
            ${archived.length ? `<div class="grid${isCompact ? ' compact-grid' : ''}">${archived.map((p) => PNPL.projectCard(p, { compactView: isCompact })).join('')}</div>` : '<p>No archived projects yet.</p>'}
          </main>
          ${PNPL.footer()}
        `;

        if (archived.length) {
          el.querySelectorAll('.view-toggle button').forEach((btn) => {
            btn.addEventListener('click', () => {
              const mode = btn.dataset.view;
              PNPL.setViewMode(mode);
              window.location.reload();
            });
          });
        }
      })();
    </script>
  </body>
</html>
