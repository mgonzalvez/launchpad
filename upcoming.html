<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Print-and-play projects with announced launch dates — what is coming to Kickstarter, Gamefound and Itch.io next." />
    <meta property="og:title" content="Upcoming Projects | PnP Launchpad" />
    <meta property="og:description" content="Print-and-play projects with announced launch dates — what is coming to Kickstarter, Gamefound and Itch.io next." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://launchpad.gonzhome.us/upcoming.html" />
    <meta property="og:image" content="https://launchpad.gonzhome.us/uploads/og-launchpad.jpg" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://launchpad.gonzhome.us/upcoming.html" />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="shortcut icon" href="assets/logo.svg" />
    <title>Upcoming Projects | PnP Launchpad</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pnpl_theme_v1');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="assets/app.js"></script>
    <script src="assets/search.js"></script>
    <script>
      (async () => {
        const el = document.getElementById('app');
        const data = await PNPL.loadContent();
        const projects = PNPL.enrichProjects(data);
        const now = new Date();
        const upcoming = projects
          .filter((p) => PNPL.projectStatus(p, now) === 'upcoming')
          .sort((a, b) => PNPL.parseDate(a.launchDate) - PNPL.parseDate(b.launchDate));

        el.innerHTML = `
          ${PNPL.header('Upcoming')}
          <main id="main">
            <section class="hero">
              <h1>Upcoming Projects</h1>
              <p>Projects that have been announced and are not live yet.</p>
            </section>
            ${upcoming.length ? `<div class="grid">${upcoming.map((p) => PNPL.projectCard(p)).join('')}</div>` : PNPL.emptyState('No upcoming projects yet', 'Nothing has an announced launch date right now. New listings are added as campaigns are announced.')}
          </main>
          ${PNPL.footer()}
        `;
      })();
    </script>
  </body>
</html>
